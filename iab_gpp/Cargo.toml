[package]
name = "iab_gpp"
version = "0.1.2"
rust-version = "1.89.0"
edition = "2024"
authors = ["Marc Noirot <marc.noirot@gmail.com>"]
description = "IAB GPP Consent String implementation"
homepage = "https://github.com/noirotm/iabgpp-rs"
repository = "https://github.com/noirotm/iabgpp-rs"
license = "Apache-2.0"
keywords = ["tcf", "iab", "gpp", "decode"]
categories = ["parser-implementations"]
documentation = "https://docs.rs/iab_gpp/"
readme = "crates-io.md"
build = "build.rs"

[dependencies]
bitstream-io = "4.10.0"
iab_gpp_derive = { version = "0.2", path = "../iab_gpp_derive" }
num-derive = "0.5.1"
num-iter = "0.1.46"
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"], optional = true }
strum_macros = "0.28.0"
thiserror = "2.0.21"

[dev-dependencies]
test-case = "3.4.1"
serde = "1.0.229"
serde_json = "1.0.154"
assert-json-diff = "2.0.2"
criterion = "0.8.2"

[build-dependencies]
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"
walkdir = "2.5.0"

[features]
serde = ["dep:serde"]

[[bench]]
name = "decode"
harness = false
